<!DOCTYPE html>

<body class="bg-gray-900 text-gray-100">

                                    <YAxis dataKey="subject" type="category" stroke="#fff" width={100} tick={{fontSize: 12}} />

                                    <Bar dataKey="A" name="Crescimento (%)" fill="#F43F5E" radius={[0, 4, 4, 0]} barSize={24} label={{ position: 'right', fill: '#fff', formatter: (val) => `+${val}%` }} />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>
                        <p className="text-center text-xs text-gray-500 mt-2">Crescimento na Udemy</p>
                    </div>
                </div>

                <div className="grid md:grid-cols-3 gap-4">
                    <div className="bg-gray-900 p-5 rounded-lg border border-gray-800 text-center hover:border-red-500 transition-colors">
                        <IconCompass className="mx-auto text-red-400 mb-2" size={32} />
                        <h4 className="text-white font-bold">Ambiguidade</h4>
                        <p className="text-xs text-gray-400 mt-1">Operar sem respostas claras.</p>
                    </div>
                    <div className="bg-gray-900 p-5 rounded-lg border border-gray-800 text-center hover:border-red-500 transition-colors">
                        <IconBrain className="mx-auto text-red-400 mb-2" size={32} />
                        <h4 className="text-white font-bold">Julgamento</h4>
                        <p className="text-xs text-gray-400 mt-1">Validar resultados da IA.</p>
                    </div>
                    <div className="bg-gray-900 p-5 rounded-lg border border-gray-800 text-center hover:border-red-500 transition-colors">
                        <IconAward className="mx-auto text-red-400 mb-2" size={32} />
                        <h4 className="text-white font-bold">Agilidade</h4>
                        <p className="text-xs text-gray-400 mt-1">Desaprender e reaprender.</p>
                    </div>
                </div>
            </div>
        );

        // --- 6. COMPONENTE PRINCIPAL ---
        
        const App = () => {
            const [activeTab, setActiveTab] = useState('intro');
            const [isMenuOpen, setIsMenuOpen] = useState(false); // Para mobile

            // Renderização Condicional de Conteúdo
            const renderContent = () => {
                switch (activeTab) {
                    case 'intro': return (
                        <div className="text-center space-y-8 py-12 animate-fadeIn max-w-4xl mx-auto">
                            <h1 className="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-4 px-4 leading-tight">
                                2026
                            </h1>
                            <h2 className="text-2xl md:text-3xl text-white font-light tracking-widest uppercase mb-8">
                                Global Learning & <br/> Skills Trends Report
                            </h2>
                            <div className="bg-gray-800/80 p-8 rounded-2xl border border-gray-700 mx-4 backdrop-blur-sm shadow-2xl">
                                <p className="text-xl text-gray-200 leading-relaxed mb-8 font-light">
                                    "Navegação transformacional na era da IA e além."
                                </p>
                                <button onClick={() => setActiveTab('trend1')} className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-10 rounded-full transition-all transform hover:scale-105 flex items-center gap-3 mx-auto shadow-lg shadow-purple-900/50">
                                    Explorar Tendências <IconArrowRight size={24} />
                                </button>
                            </div>
                        </div>
                    );
                    case 'trend1': return <SectionAIFluency />;
                    case 'trend2': return <SectionImmersion />;
                    case 'trend3': return <SectionLeadership />;
                    case 'trend4': return <SectionBeyondAI />;
                    case 'methodology': return (
                        <div className="max-w-3xl mx-auto space-y-6 animate-fadeIn">
                            <h2 className="text-3xl font-bold text-white mb-6">Metodologia</h2>
                            <Card title="Fonte de Dados">
                                <p className="mb-4">Dados de milhares de clientes globais da Udemy Business.</p>
                                <ul className="list-disc pl-5 space-y-2 text-gray-300">
                                    <li>Período: 1º Jul 2024 a 30 Jun 2025.</li>
                                    <li>Comparação anual de crescimento de consumo.</li>
                                </ul>
                            </Card>
                        </div>
                    );
                    default: return null;
                }
            };

            const NavButton = ({ id, icon: Icon, label, color }) => (
                <button
                    onClick={() => { setActiveTab(id); setIsMenuOpen(false); }}
                    className={`w-full flex items-center gap-3 p-3 rounded-lg transition-all duration-200 ${
                        activeTab === id ? 'bg-gray-700 text-white shadow-lg translate-x-1' : 'hover:bg-gray-800 text-gray-400'
                    }`}
                >
                    <Icon className={color} size={24} />
                    <span className="font-medium text-sm md:text-base">{label}</span>
                </button>
            );

            return (
                <div className="flex flex-col md:flex-row min-h-screen relative bg-gray-900 text-gray-100 font-sans selection:bg-purple-500 selection:text-white">
                    
                    {/* Sidebar (Desktop) */}
                    <aside className="hidden md:flex flex-col w-72 bg-gray-900 border-r border-gray-800 p-6 fixed h-full z-20 overflow-y-auto">
                        <div className="mb-10 text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 cursor-pointer tracking-tight" onClick={() => setActiveTab('intro')}>
                            Udemy Trends
                        </div>
                        <nav className="space-y-3 flex-1">
                            <NavButton id="trend1" icon={IconBrain} label="1. Fluência em IA" color="text-purple-400" />
                            <NavButton id="trend2" icon={IconZap} label="2. Imersão" color="text-pink-400" />
                            <NavButton id="trend3" icon={IconUsers} label="3. Liderança" color="text-yellow-400" />
                            <NavButton id="trend4" icon={IconCompass} label="4. Além da IA" color="text-red-400" />
                            <div className="h-px bg-gray-800 my-4"></div>
                            <NavButton id="methodology" icon={IconInfo} label="Metodologia" color="text-gray-400" />
                        </nav>
                        <div className="text-xs text-gray-600 mt-auto pt-6 text-center">
                            Udemy Business Report 2026
                        </div>
                    </aside>

                    {/* Conteúdo Principal */}
                    <main className="flex-1 md:ml-72 p-6 md:p-12 pb-24 min-h-screen relative z-0 bg-gray-900">
                         {/* Background Effects */}
                        <div className="fixed top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/20 via-gray-900 to-gray-900 -z-10 pointer-events-none"></div>

                        <div className="max-w-6xl mx-auto">
                            {renderContent()}
                        </div>
                    </main>

                    {/* Mobile Navigation Bar (Fixed Bottom) */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-gray-800/95 backdrop-blur-md border-t border-gray-700 p-3 flex justify-around z-50 pb-safe">
                        <button onClick={() => setActiveTab('intro')} className={`p-2 rounded-full transition-colors ${activeTab === 'intro' ? 'text-white bg-gray-700' : 'text-gray-400'}`}><IconBookOpen size={24}/></button>
                        <button onClick={() => setActiveTab('trend1')} className={`p-2 rounded-full transition-colors ${activeTab === 'trend1' ? 'text-purple-400 bg-gray-700' : 'text-gray-400'}`}><IconBrain size={24}/></button>
                        <button onClick={() => setActiveTab('trend2')} className={`p-2 rounded-full transition-colors ${activeTab === 'trend2' ? 'text-pink-400 bg-gray-700' : 'text-gray-400'}`}><IconZap size={24}/></button>
                        <button onClick={() => setActiveTab('trend3')} className={`p-2 rounded-full transition-colors ${activeTab === 'trend3' ? 'text-yellow-400 bg-gray-700' : 'text-gray-400'}`}><IconUsers size={24}/></button>
                        <button onClick={() => setActiveTab('trend4')} className={`p-2 rounded-full transition-colors ${activeTab === 'trend4' ? 'text-red-400 bg-gray-700' : 'text-gray-400'}`}><IconCompass size={24}/></button>
                    </div>
                </div>
            );
        };

        // --- 7. INICIALIZAÇÃO SEGURA ---
        try {
            const rootElement = document.getElementById('root');
            if (rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<App />);
            } else {
                console.error("Elemento ROOT não encontrado.");
            }
        } catch (error) {
            console.error("Erro ao montar a aplicação:", error);
            document.body.innerHTML = '<div style="color: white; padding: 20px;">Ocorreu um erro ao carregar o relatório. Por favor, atualize a página.</div>';
        }
    </script>
</body>
</html>

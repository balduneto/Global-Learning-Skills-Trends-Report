<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Tendências Globais 2026 - Udemy Business</title>
    
    <!-- Carregando Bibliotecas via CDN (Versões Fixadas para Estabilidade) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React Core -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Dependências do Recharts -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            color: #F7F9FA;
            overflow-x: hidden; /* Previne rolagem horizontal indesejada */
        }

        /* Animações Customizadas */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.6s ease-out forwards;
        }

        /* Scrollbar Personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1F2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4B5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6B7280;
        }
        
        /* Ajuste para Recharts em Mobile */
        .recharts-wrapper {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- SETUP INICIAL ---
        const { useState, useEffect } = React;
        
        // Extração segura do Recharts
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
            PieChart, Pie, Cell 
        } = window.Recharts;

        // --- COMPONENTES DE ÍCONES (SVG Inline para estabilidade total) ---
        const Brain = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>;
        const Zap = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
        const Users = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const Compass = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>;
        const TrendingUp = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        const BookOpen = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
        const Award = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>;
        const ShieldCheck = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>;
        const ArrowRight = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
        const Info = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;
        const Lightbulb = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.4 1.5-3.8 0-3.2-2.8-5.7-6-5.7S6 4.5 6 7.8c0 1.4.5 2.8 1.5 3.8.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>;

        // --- DADOS ---
        const growthData = [
          { name: 'MS Copilot', growth: 3400, label: '+3.400%' },
          { name: 'GitHub Copilot', growth: 13534, label: '+13.534%' },
        ];

        const skillsData = [
          { subject: 'Decisão', A: 38 },
          { subject: 'Pensamento', A: 37 },
          { subject: 'Comunicação', A: 25 },
        ];

        const leadershipData = [
          { name: 'Confiam', value: 55 },
          { name: 'Não Confiam', value: 45 },
        ];

        const leadershipPreparedData = [
          { name: 'Preparados', value: 48 },
          { name: 'Não Prep.', value: 52 },
        ];

        // --- COMPONENTES DA UI ---

        const DidacticNote = ({ title, text }) => (
          <div className="mt-4 bg-blue-900/20 border border-blue-500/30 rounded-lg p-3 flex items-start gap-3">
            <Lightbulb className="text-yellow-400 shrink-0 mt-0.5" size={18} />
            <div>
              <h4 className="text-blue-200 font-bold text-sm mb-1">{title}</h4>
              <p className="text-gray-300 text-xs md:text-sm leading-snug">{text}</p>
            </div>
          </div>
        );

        const Card = ({ title, children, noteTitle, noteText, className = "" }) => (
          <div className={`bg-gray-800 border-l-4 border-purple-500 rounded-lg p-4 md:p-6 shadow-lg ${className}`}>
            <h3 className="text-lg md:text-xl font-bold mb-3 md:mb-4 text-white flex items-center gap-2">
              {title}
            </h3>
            <div className="text-gray-300 text-sm md:text-base leading-relaxed">
              {children}
            </div>
            {(noteTitle || noteText) && <DidacticNote title={noteTitle} text={noteText} />}
          </div>
        );

        const StatBox = ({ label, value, subtext, icon: Icon, color = "text-purple-400" }) => (
          <div className="bg-gray-900 rounded-xl p-4 md:p-5 border border-gray-700 flex items-start gap-3 md:gap-4 w-full">
            <div className={`p-2 md:p-3 rounded-full bg-gray-800 ${color} shrink-0`}>
              <Icon size={20} className="md:w-6 md:h-6" />
            </div>
            <div>
              <div className="text-2xl md:text-3xl font-extrabold text-white">{value}</div>
              <div className="text-xs md:text-sm font-medium text-gray-400 uppercase tracking-wide">{label}</div>
              {subtext && <div className="text-[10px] md:text-xs text-gray-500 mt-1">{subtext}</div>}
            </div>
          </div>
        );

        const InsightBadge = ({ text }) => (
          <div className="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-teal-900/50 text-teal-300 text-[10px] md:text-xs font-bold border border-teal-700 mb-3 md:mb-4">
            <Zap size={10} className="md:w-3 md:h-3" /> INSIGHT ESTRATÉGICO
          </div>
        );

        // --- SEÇÕES DO APP ---

        const SectionAIFluency = () => (
            <div className="space-y-6 md:space-y-8 pb-6 animate-fadeIn">
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-8">
                <div>
                    <InsightBadge text="Mudança de Paradigma" />
                    <h2 className="text-2xl md:text-4xl font-bold text-white mb-3 md:mb-4">
                    <span className="text-purple-400">01.</span> A Fluência em IA é o Novo Sistema Operacional
                    </h2>
                    <p className="text-base md:text-lg text-gray-300 mb-6 leading-relaxed">
                    A fluência em IA deixou de ser um objetivo técnico para se tornar a base operacional das empresas. 
                    Não se trata apenas de usar ferramentas, mas de reestruturar a empresa para <strong>experimentar</strong> e 
                    <strong> incorporar</strong> a IA aos fluxos de trabalho.
                    </p>
                    <DidacticNote 
                    title="Conceito Chave: Fluência vs. Habilidade" 
                    text="Habilidade é saber usar a ferramenta. Fluência é saber QUANDO usar, entender suas limitações éticas e aplicá-la estrategicamente."
                    />
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mt-6">
                    <StatBox 
                        icon={TrendingUp} 
                        value="+13.534%" 
                        label="GitHub Copilot" 
                        subtext="Crescimento em Tech"
                        color="text-green-400"
                    />
                    <StatBox 
                        icon={TrendingUp} 
                        value="+3.400%" 
                        label="MS Copilot" 
                        subtext="Crescimento em Business"
                        color="text-blue-400"
                    />
                    </div>
                </div>
                <div className="bg-gray-800 p-6 rounded-xl border border-gray-700 flex flex-col justify-center">
                    <h3 className="text-lg font-semibold text-white mb-6 text-center">Explosão no Aprendizado de Ferramentas</h3>
                    
                    <div style={{ width: '100%', height: 300, minHeight: 300 }}>
                    <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={growthData} layout="vertical" margin={{ top: 5, right: 30, left: 20, bottom: 5 }}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#374151" horizontal={true} vertical={false}/>
                        <XAxis type="number" stroke="#9CA3AF" hide />
                        <YAxis 
                            dataKey="name" 
                            type="category" 
                            stroke="#F3F4F6" 
                            width={100} 
                            style={{ fontSize: '12px', fontWeight: 'bold' }} 
                        />
                        <Tooltip 
                            contentStyle={{ backgroundColor: '#1F2937', borderColor: '#374151', color: '#fff' }} 
                            cursor={{fill: '#374151', opacity: 0.4}}
                        />
                        <Bar dataKey="growth" fill="#8b5cf6" radius={[0, 4, 4, 0]} label={{ position: 'right', fill: '#fff', formatter: (val) => `+${val.toLocaleString()}%` }} />
                        </BarChart>
                    </ResponsiveContainer>
                    </div>
                    
                    <p className="text-xs text-gray-500 mt-4 italic text-center">
                    *Crescimento anual no consumo de cursos na Udemy Business
                    </p>
                </div>
                </div>

                <div className="grid md:grid-cols-3 gap-6">
                <Card title="Nível 1: Alfabetização" noteTitle="Foco Pedagógico" noteText="Remover o medo da tecnologia através do contato inicial e uso pessoal.">
                    Familiaridade com ferramentas (ChatGPT, Gemini). Foco em produtividade individual.
                </Card>
                <Card title="Nível 2: Assistência" noteTitle="Integração" noteText="A IA deixa de ser uma 'aba no navegador' e passa a integrar softwares corporativos.">
                    Integração no fluxo de trabalho. IA apoiando análise e decisões estratégicas.
                </Card>
                <Card title="Nível 3: Agentes" noteTitle="Futuro do Trabalho" noteText="Humanos gerenciam 'exércitos' de agentes que executam tarefas autônomas.">
                    IA agêntica tomando decisões autônomas sob supervisão.
                </Card>
                </div>
            </div>
        );

        const SectionImmersion = () => (
            <div className="space-y-8 pb-6 animate-fadeIn">
                <div className="flex flex-col md:flex-row justify-between items-start gap-6">
                <div className="md:w-2/3">
                    <InsightBadge text="Metodologia de Aprendizagem" />
                    <h2 className="text-2xl md:text-4xl font-bold text-white mb-4">
                    <span className="text-pink-500">02.</span> A Imersão Supera a Instrução
                    </h2>
                    <p className="text-base md:text-lg text-gray-300 mb-6">
                    Aprender IA acontece de forma mais eficaz <strong>no fluxo de trabalho</strong>. 
                    O modelo de "sala de aula" isolada está obsoleto. A prática em projetos reais consolida habilidades 
                    de forma 3x mais eficiente.
                    </p>
                    <DidacticNote 
                    title="O Modelo 70-20-10" 
                    text="Este insight valida a regra de RH: 70% do aprendizado vem da prática, 20% da interação e 10% de cursos formais."
                    />
                </div>
                <div className="md:w-1/3 w-full">
                    <div className="bg-gradient-to-r from-pink-600 to-purple-600 p-6 rounded-xl shadow-lg text-center">
                        <h3 className="text-4xl md:text-5xl font-extrabold text-white mb-2">3x</h3>
                        <p className="text-white font-medium text-sm md:text-base">Mais Eficiente</p>
                        <p className="text-[10px] md:text-xs text-pink-200 mt-2">Alunos que aplicam habilidades na prática (Fonte: Carnegie Mellon)</p>
                    </div>
                </div>
                </div>

                <div className="grid md:grid-cols-2 gap-8 mt-8">
                <div className="space-y-4">
                    <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-2">
                    <Award className="text-yellow-400" /> Casos de Sucesso
                    </h3>
                    
                    <div className="bg-gray-800 p-5 rounded-lg border-l-4 border-blue-500">
                    <div className="flex justify-between items-start">
                        <h4 className="font-bold text-white text-lg">Genpact</h4>
                        <span className="bg-blue-900 text-blue-200 text-xs px-2 py-1 rounded">12 Semanas</span>
                    </div>
                    <p className="text-gray-400 text-sm mt-2 mb-3">Programa imersivo para conhecimento em LLMs e IA Generativa.</p>
                    <div className="flex gap-4">
                        <div className="text-center">
                        <span className="block text-2xl font-bold text-white">100%</span>
                        <span className="text-xs text-gray-500">Meta Atingida</span>
                        </div>
                        <div className="text-center">
                        <span className="block text-2xl font-bold text-white">75%</span>
                        <span className="text-xs text-gray-500">Proficiência</span>
                        </div>
                    </div>
                    </div>

                    <div className="bg-gray-800 p-5 rounded-lg border-l-4 border-green-500">
                    <div className="flex justify-between items-start">
                        <h4 className="font-bold text-white text-lg">Devoteam</h4>
                        <span className="bg-green-900 text-green-200 text-xs px-2 py-1 rounded">3 Meses</span>
                    </div>
                    <p className="text-gray-400 text-sm mt-2 mb-3">Treinamento global de IA generativa.</p>
                    <div className="flex gap-4">
                        <div className="text-center">
                        <span className="block text-2xl font-bold text-white">70%</span>
                        <span className="text-xs text-gray-500">Capacitados</span>
                        </div>
                        <div className="text-center">
                        <span className="block text-2xl font-bold text-white text-green-400">-4%</span>
                        <span className="text-xs text-gray-500">Rotatividade</span>
                        </div>
                    </div>
                    </div>
                </div>

                <div className="bg-gray-900 p-6 rounded-xl border border-gray-700 flex flex-col justify-center">
                    <h3 className="text-lg font-semibold text-white mb-6 text-center">O Ciclo de Habilidades Imersivas</h3>
                    <div className="space-y-4 relative">
                    <div className="absolute left-4 top-4 bottom-4 w-0.5 bg-gray-700"></div>
                    <div className="relative pl-10">
                        <div className="absolute left-2 top-1.5 w-4 h-4 bg-purple-500 rounded-full border-4 border-gray-900"></div>
                        <h5 className="text-white font-bold">1. Aquisição</h5>
                        <p className="text-sm text-gray-400">Aprender o conceito (Microlearning).</p>
                    </div>
                    <div className="relative pl-10">
                        <div className="absolute left-2 top-1.5 w-4 h-4 bg-pink-500 rounded-full border-4 border-gray-900"></div>
                        <h5 className="text-white font-bold">2. Domínio (Simulação)</h5>
                        <p className="text-sm text-gray-400">Prática em ambiente seguro (Sandbox/Labs).</p>
                    </div>
                    <div className="relative pl-10">
                        <div className="absolute left-2 top-1.5 w-4 h-4 bg-teal-500 rounded-full border-4 border-gray-900"></div>
                        <h5 className="text-white font-bold">3. Aplicação no Fluxo</h5>
                        <p className="text-sm text-gray-400">Uso em projetos reais com feedback imediato.</p>
                    </div>
                    </div>
                    <DidacticNote 
                    title="Segurança Psicológica" 
                    text="A fase 2 (Simulação) é crucial. Cria um ambiente onde o erro é permitido antes da aplicação real."
                    />
                </div>
                </div>
            </div>
        );

        const SectionLeadership = () => (
            <div className="space-y-8 pb-6 animate-fadeIn">
                <div className="text-center max-w-3xl mx-auto mb-10">
                <InsightBadge text="Fator Humano" />
                <h2 className="text-2xl md:text-4xl font-bold text-white mb-4">
                    <span className="text-yellow-500">03.</span> Liderança, Ética e Autonomia
                </h2>
                <p className="text-base md:text-lg text-gray-300">
                    Não é possível escalar habilidades de IA sem escalar a confiança. 
                    A ansiedade sobre IA é sintoma de falha na liderança.
                </p>
                </div>

                <div className="grid md:grid-cols-2 gap-8 items-center">
                <div className="bg-gray-800 p-6 rounded-xl border border-gray-700 h-full flex flex-col justify-between">
                    <h3 className="text-xl font-bold text-white mb-6 text-center">A Lacuna de Confiança</h3>
                    <div className="flex flex-col sm:flex-row justify-around items-center gap-8 h-full">
                    <div className="w-full sm:w-1/2 relative" style={{ height: 200, minHeight: 200 }}>
                        <ResponsiveContainer width="100%" height="100%">
                        <PieChart>
                            <Pie
                            data={leadershipData}
                            cx="50%"
                            cy="50%"
                            innerRadius={50}
                            outerRadius={70}
                            paddingAngle={5}
                            dataKey="value"
                            >
                            <Cell fill="#10B981" />
                            <Cell fill="#374151" />
                            </Pie>
                            <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle" className="fill-white text-xl font-bold">
                            55%
                            </text>
                        </PieChart>
                        </ResponsiveContainer>
                        <p className="text-center text-xs md:text-sm text-gray-400 mt-2">Confiam na gestão</p>
                    </div>
                    
                    <div className="w-full sm:w-1/2 relative" style={{ height: 200, minHeight: 200 }}>
                        <ResponsiveContainer width="100%" height="100%">
                        <PieChart>
                            <Pie
                            data={leadershipPreparedData}
                            cx="50%"
                            cy="50%"
                            innerRadius={50}
                            outerRadius={70}
                            paddingAngle={5}
                            dataKey="value"
                            >
                            <Cell fill="#F59E0B" />
                            <Cell fill="#374151" />
                            </Pie>
                            <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle" className="fill-white text-xl font-bold">
                            48%
                            </text>
                        </PieChart>
                        </ResponsiveContainer>
                        <p className="text-center text-xs md:text-sm text-gray-400 mt-2">Líderes preparados</p>
                    </div>
                    </div>
                    <DidacticNote 
                    title="Interpretação da Lacuna" 
                    text="Menos da metade dos funcionários acredita que seus líderes estão prontos. Isso gera resistência à adoção."
                    />
                </div>

                <div className="space-y-4">
                    <Card title="O Novo Papel do Líder" className="bg-gray-800/50" noteTitle="Soft Skills na Liderança" noteText="A liderança na era da IA é menos sobre comando e controle e mais sobre orquestração e ética.">
                    <ul className="space-y-3">
                        <li className="flex items-start gap-3">
                        <ShieldCheck className="text-green-400 mt-1" size={20} />
                        <span className="text-gray-300 text-sm"><strong>Guardião Ético:</strong> Estabelecer limites claros e "regras do jogo".</span>
                        </li>
                        <li className="flex items-start gap-3">
                        <Users className="text-blue-400 mt-1" size={20} />
                        <span className="text-gray-300 text-sm"><strong>Facilitador de Autonomia:</strong> Distribuir a tomada de decisão.</span>
                        </li>
                        <li className="flex items-start gap-3">
                        <Brain className="text-purple-400 mt-1" size={20} />
                        <span className="text-gray-300 text-sm"><strong>Modelo de Aprendizado:</strong> Líderes devem usar IA visivelmente.</span>
                        </li>
                    </ul>
                    </Card>
                    
                    <div className="bg-blue-900/20 border border-blue-800 p-4 rounded-lg">
                    <h4 className="text-blue-300 font-bold mb-1">Destaque: PepsiCo</h4>
                    <p className="text-sm text-gray-300 mb-2">Programa de Liderança em Compras</p>
                    <div className="flex items-center gap-2">
                        <TrendingUp className="text-green-400" size={18} />
                        <span className="text-white font-bold">2x</span>
                        <span className="text-gray-400 text-sm">Aumento na taxa de promoção.</span>
                    </div>
                    </div>
                </div>
                </div>
            </div>
        );

        const SectionBeyondAI = () => (
            <div className="space-y-8 pb-6 animate-fadeIn">
                <div className="grid md:grid-cols-2 gap-12">
